name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android App
        run: |
          cordova create app com.aldosari.academy AldosariAcademy
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          cordova platform add android@13.0.0

      - name: Build APK
        run: |
          cd app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aldosari-Academy-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
