name: Build Al-Dosari Academy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Android Native Project Structure
        run: |
          mkdir -p app/src/main/java/com/aldosari/academy
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          rootProject.name = 'AlDosariAcademy'
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.aldosari.academy'
              compileSdkVersion 34
              defaultConfig {
                  applicationId "com.aldosari.academy"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="أكاديمية الدوسري"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/aldosari/academy/MainActivity.java
          package com.aldosari.academy;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_CODE = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  }

                  startLocalSecureServer();

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("audio/*");
                          startActivityForResult(Intent.createChooser(intent, "اختر مقطعاً صوتياً"), FILE_CHOOSER_CODE);
                          return true;
                      }
                  });

                  webView.loadUrl("http://127.0.0.1:8765/");
              }

              private void startLocalSecureServer() {
                  new Thread(() -> {
                      try {
                          ServerSocket server = new ServerSocket(8765, 50, InetAddress.getByName("127.0.0.1"));
                          while (true) {
                              Socket client = server.accept();
                              InputStream is = getAssets().open("index.html");
                              ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                              byte[] data = new byte[4096];
                              int nRead;
                              while ((nRead = is.read(data, 0, data.length)) != -1) {
                                  buffer.write(data, 0, nRead);
                              }
                              is.close();
                              byte[] bytes = buffer.toByteArray();
                              OutputStream out = client.getOutputStream();
                              String header = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: " + bytes.length + "\r\nConnection: close\r\n\r\n";
                              out.write(header.getBytes("UTF-8"));
                              out.write(bytes);
                              out.flush();
                              client.close();
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null && data.getDataString() != null) {
                          results = new Uri[]{Uri.parse(data.getDataString())};
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: AlDosari-Academy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
